name: 위험물 정보 갱신

on:
  schedule:
    - cron: '17 18 1 * *'   # 매월 2일 03:17 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 국가위험물정보 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-materials.mjs
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/materials.json
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "위험물 정보 갱신 $(date -u +%Y-%m-%d)" && git push; fi
